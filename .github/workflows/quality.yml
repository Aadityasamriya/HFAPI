name: HFAPI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall -q bot *.py

      - name: Discover and run test suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(git ls-files -- '*test*.py' 'test_*.py' '*_test.py' | sort -u)
          if ((${#TEST_FILES[@]} == 0)); then
            echo 'ERROR: No repository test files found.'
            echo 'Tracked Python files:'
            git ls-files -- '*.py' | sed -n '1,120p'
            exit 1
          fi
          printf 'Running %s test files:\n' "${#TEST_FILES[@]}"
          printf ' - %s\n' "${TEST_FILES[@]}"
          python -m pytest -q "${TEST_FILES[@]}"
