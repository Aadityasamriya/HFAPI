name: HFAPI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall -q bot *.py

      - name: Run test suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.git/*' | sort)
          if ((${#TEST_FILES[@]} == 0)); then
            echo 'No test files found.'
            exit 1
          fi
          printf 'Running %s test files:\n' "${#TEST_FILES[@]}"
          printf ' - %s\n' "${TEST_FILES[@]}"
          python -m pytest -q
