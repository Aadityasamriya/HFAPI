name: HFAPI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run tests when present
        shell: bash
        run: |
          if find . -type f -name 'test_*.py' -o -type f -name '*_test.py' | grep -q .; then
            pytest -q
          else
            echo 'No test files found; syntax/dependency gate still passed.'
          fi
