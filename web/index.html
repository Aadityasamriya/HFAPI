<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>HFAPI — AI Control Center</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b16;color:#edf2ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#17244b 0,#070b16 42%);}
    .wrap{max-width:1100px;margin:auto;padding:28px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#6d7cff,#9b5cff);font-weight:800}.eyebrow{font-size:12px;color:#8fa0c9;text-transform:uppercase;letter-spacing:.14em}.title{margin:2px 0 0;font-size:28px}.pill{padding:8px 12px;border:1px solid #283555;border-radius:999px;color:#b8c5e8;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:rgba(13,19,37,.82);border:1px solid #202b49;border-radius:18px;padding:18px;box-shadow:0 16px 45px rgba(0,0,0,.18)}.hero{grid-column:1/-1;padding:26px}.status{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}.dot{width:11px;height:11px;border-radius:50%;background:#7d8aa8}.healthy{background:#4ade80}.degraded{background:#facc15}.unhealthy{background:#fb7185}.metric{font-size:30px;font-weight:800;margin-top:8px}.label{color:#8fa0c9;font-size:13px}.checks{display:grid;gap:10px;margin-top:14px}.check{display:flex;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:#0a1021}.check span:first-child{color:#c6d0e9}.ok{color:#4ade80}.bad{color:#fb7185}.muted{color:#7180a5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#eef2ff;border:1px solid #304065;background:#111a31;padding:10px 14px;border-radius:10px;font-size:14px}.btn:hover{border-color:#687cff}.footer{margin-top:18px;color:#657394;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{grid-column:auto}.title{font-size:23px}.top{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="brand"><div class="logo">HF</div><div><div class="eyebrow">AadityaLabs</div><h1 class="title">HFAPI Control Center</h1></div></div><div class="pill" id="refresh">Live health · 30s cache</div></header>
    <section class="grid">
      <article class="card hero"><div class="status"><span class="dot" id="dot"></span><span id="status">Checking system…</span></div><div class="label" id="message">Loading service health</div><div class="actions"><a class="btn" href="/health/json">Health JSON</a><a class="btn" href="/health">Health</a><a class="btn" href="/status">Status</a></div></article>
      <article class="card"><div class="label">Uptime</div><div class="metric" id="uptime">—</div></article>
      <article class="card"><div class="label">Environment</div><div class="metric" id="environment">—</div></article>
      <article class="card"><div class="label">Service</div><div class="metric">Telegram + Web</div></article>
      <article class="card hero"><div class="label">System checks</div><div class="checks" id="checks"><div class="muted">Loading checks…</div></div></article>
    </section>
    <div class="footer">One process, one PORT, shared health state. Telegram bot and web control center run together.</div>
  </main>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function load(){try{const r=await fetch('/api/status',{cache:'no-store'});const d=await r.json();const state=d.status||'unknown';document.getElementById('status').textContent=state.toUpperCase();document.getElementById('message').textContent=d.message||'No status message';document.getElementById('dot').className='dot '+state;document.getElementById('uptime').textContent=(d.uptime_seconds/3600).toFixed(1)+' h';document.getElementById('environment').textContent=esc(d.environment||'unknown');const checks=d.checks||{};document.getElementById('checks').innerHTML=Object.entries(checks).map(([k,v])=>{const ok=v&&v.healthy;return `<div class="check"><span>${esc(k.replaceAll('_',' '))}</span><strong class="${ok?'ok':'bad'}">${ok?'OK':'ISSUE'}</strong></div>`}).join('')||'<div class="muted">No checks reported</div>'}catch(e){document.getElementById('status').textContent='UNAVAILABLE';document.getElementById('message').textContent='Web status endpoint unavailable';document.getElementById('dot').className='dot unhealthy'}}load();setInterval(load,30000);
  </script>
</body>
</html>
